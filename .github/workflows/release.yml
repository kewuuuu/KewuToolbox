name: Build and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CSC_IDENTITY_AUTO_DISCOVERY: false
  ELECTRON_BUILDER_COMPRESSION_LEVEL: 1

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        # actions/checkout@v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # actions/setup-node@v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron builder downloads
        # actions/cache@v5.0.5
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm ci

      - name: Build deliverables
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $logDir = Join-Path $PWD 'release-ci-logs'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $logPath = Join-Path $logDir 'build-deliver.log'
          $summaryPath = Join-Path $logDir 'environment.txt'

          Write-Host "Node version: $(node -v)"
          Write-Host "npm version: $(npm -v)"
          "Node version: $(node -v)" | Set-Content -LiteralPath $summaryPath -Encoding UTF8
          "npm version: $(npm -v)" | Add-Content -LiteralPath $summaryPath -Encoding UTF8
          "Runner OS: $env:RUNNER_OS" | Add-Content -LiteralPath $summaryPath -Encoding UTF8
          "Image OS: $env:ImageOS" | Add-Content -LiteralPath $summaryPath -Encoding UTF8

          & npm.cmd run build:deliver 2>&1 | Tee-Object -FilePath $logPath
          $buildExitCode = $LASTEXITCODE

          if (Test-Path -LiteralPath 'release/deliver') {
            Get-ChildItem -LiteralPath 'release/deliver' -Force | Select-Object Name, Length, LastWriteTime
          }

          if ($buildExitCode -ne 0) {
            $tail = "npm run build:deliver exited with code $buildExitCode."
            if (Test-Path -LiteralPath $logPath) {
              $tailLines = Get-Content -LiteralPath $logPath -Tail 40
              if ($tailLines) {
                $tail = ($tailLines -join "`n")
              }
            }
            if ($tail.Length -gt 4000) {
              $tail = $tail.Substring($tail.Length - 4000)
            }
            $escapedTail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Build deliverables failed::$escapedTail"
            throw "npm run build:deliver failed with code $buildExitCode"
          }

      - name: Upload release build logs
        if: always()
        # actions/upload-artifact@v5.0.0
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-build-logs
          path: release-ci-logs/**
          if-no-files-found: ignore

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = node -p "require('./package.json').version"
          if (-not $version) {
            throw 'package.json version is empty.'
          }
          $tag = "v$version"
          $deliverDir = Join-Path $PWD 'release/deliver'
          if (-not (Test-Path -LiteralPath $deliverDir)) {
            throw 'release/deliver was not generated.'
          }

          $assets = Get-ChildItem -LiteralPath $deliverDir -File
          if (-not $assets) {
            throw 'No release assets found.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

          $previousTag = git tag --sort=-v:refname |
            Where-Object { $_ -ne $tag } |
            Select-Object -First 1
          $fullChangelog = if ($previousTag) {
            "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/compare/$previousTag...$tag"
          } else {
            "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commits/$tag"
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notesCandidates = @(
            (Join-Path $PWD "docs/release-notes/$tag.md"),
            (Join-Path $PWD "docs/release-notes/$version.md"),
            (Join-Path $PWD 'RELEASE_NOTES.md')
          )
          $notesSource = $notesCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($notesSource) {
            Copy-Item -LiteralPath $notesSource -Destination $notesPath -Force
            $notesContent = Get-Content -LiteralPath $notesPath -Raw
            if ($notesContent -notmatch '(?im)^Full Changelog:') {
              @('', "Full Changelog: $fullChangelog") | Add-Content -LiteralPath $notesPath -Encoding UTF8
            }
          } else {
            @(
              "KewuToolbox v$version",
              '',
              '本版本由 GitHub Actions 自动构建发布。',
              '',
              '构建信息',
              "- 来源提交：$env:GITHUB_SHA",
              "- Windows 便携版：KewuToolbox-$version-portable.exe",
              "- SHA256 校验：KewuToolbox-$version-portable.exe.sha256",
              '',
              '如需显示详细更新信息，请在仓库中创建：',
              "- docs/release-notes/$tag.md",
              "- docs/release-notes/$version.md",
              '- RELEASE_NOTES.md',
              '',
              "Full Changelog: $fullChangelog"
            ) | Set-Content -LiteralPath $notesPath -Encoding UTF8
          }

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release edit $tag --title "KewuToolbox v$version" --notes-file $notesPath --latest
            $releaseInfo = gh release view $tag --json assets | ConvertFrom-Json
            foreach ($asset in $releaseInfo.assets) {
              gh release delete-asset $tag $asset.name --yes
            }
          } else {
            gh release create $tag --title "KewuToolbox v$version" --notes-file $notesPath --latest
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --clobber
          }
